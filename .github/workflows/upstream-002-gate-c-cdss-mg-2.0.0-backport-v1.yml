name: UPSTREAM-002 Gate C CDSS mg 2.0.0 Backport V1

"on":
  push:
    branches:
      - upstream-002-gate-c-cdss-mg-2.0.0-backport-v1-validation

permissions:
  contents: read

concurrency:
  group: upstream-002-gate-c-cdss-mg-2.0.0-backport-v1
  cancel-in-progress: false

env:
  UPSTREAM_RELEASE: 58c873833299339c464adbdd8121a19b57d9e398
  UPSTREAM_RELEASE_TREE: ae5b34ed4dc6fbc184d470c772587fc25fc9551e
  IMPLEMENTATION_COMMIT: 4e6c2e9cbfea5f737b73a615a107be91e985506c
  IMPLEMENTATION_TREE: 2c65e2fc1a145cb5f1679f5e9312eb0e6dfbd1ac

jobs:
  validate:
    name: Validate released CDSS 2.0.0 bounded mg backport
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact validation control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Java 8
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Verify exact source provenance and bounded scope
        shell: bash
        run: |
          set -Eeuo pipefail

          test "$(git rev-parse HEAD^)" = "$IMPLEMENTATION_COMMIT"
          test "$(git rev-parse "$IMPLEMENTATION_COMMIT^{tree}")" = "$IMPLEMENTATION_TREE"
          test "$(git rev-parse "$IMPLEMENTATION_COMMIT^")" = "$UPSTREAM_RELEASE"
          test "$(git rev-parse "$UPSTREAM_RELEASE^{tree}")" = "$UPSTREAM_RELEASE_TREE"

          actual="$(
            git diff-tree               --no-commit-id               --name-only               -r "$IMPLEMENTATION_COMMIT" |
            LC_ALL=C sort
          )"

          expected="$(
            printf '%s\n'               'api/src/main/java/org/bahmni/module/fhircdss/api/util/DosageUnitMapper.java'               'api/src/test/java/org/bahmni/module/fhircdss/api/util/DosageUnitMapperTest.java' |
            LC_ALL=C sort
          )"

          test "$actual" = "$expected"

          test "$(
            git show "$UPSTREAM_RELEASE:pom.xml" |
            grep -F -c '<version>2.0.0</version>'
          )" -ge 1

          test "$(
            git show "$UPSTREAM_RELEASE:api/src/main/java/org/bahmni/module/fhircdss/api/util/DosageUnitMapper.java" |
            grep -F -c 'MG_MG("mg", "mg"),' || true
          )" -eq 0

          test "$(
            grep -F -c 'MG_MG("mg", "mg"),'               api/src/main/java/org/bahmni/module/fhircdss/api/util/DosageUnitMapper.java
          )" -eq 1

          test "$(
            grep -F -c               'assertEquals("mg", DosageUnitMapper.getTargetUnit("mg"));'               api/src/test/java/org/bahmni/module/fhircdss/api/util/DosageUnitMapperTest.java
          )" -eq 1

          git diff "$UPSTREAM_RELEASE" "$IMPLEMENTATION_COMMIT" --check

          echo "SOURCE_CLASSIFICATION=RELEASED_2.0.0_PLUS_BOUNDED_BACKPORT"
          echo "BACKPORT_PATHS=2"
          echo "SOURCE_PROVENANCE=PASS"

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run focused mg regression test
        shell: bash
        run: |
          set -Eeuo pipefail

          ./mvnw             -B             -ntp             -pl api             -Dtest=DosageUnitMapperTest             test

          echo "MG_REGRESSION_TEST=PASS"

      - name: Run full API module tests
        shell: bash
        run: |
          set -Eeuo pipefail

          ./mvnw             -B             -ntp             -pl api             test

          echo "API_TEST_SUITE=PASS"

      - name: Build exact OMOD
        shell: bash
        run: |
          set -Eeuo pipefail

          ./mvnw             -B             -ntp             -DskipTests             package

          mapfile -t omods < <(
            find omod/target               -maxdepth 1               -type f               -name '*.omod'               -print |
            LC_ALL=C sort
          )

          test "${#omods[@]}" -eq 1

          OMOD="${omods[0]}"
          OMOD_SHA256="$(
            sha256sum "$OMOD" |
            awk '{print $1}'
          )"

          test -n "$OMOD_SHA256"

          printf 'OMOD=%s\n' "$OMOD"
          printf 'OMOD_SHA256=%s\n' "$OMOD_SHA256"

          echo "OMOD_BUILD=PASS"

      - name: Final validation summary
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "GATE=UPSTREAM-002-GATE-C-CDSS"
          echo "UPSTREAM_RELEASE=2.0.0"
          echo "UPSTREAM_RELEASE_COMMIT=$UPSTREAM_RELEASE"
          echo "IMPLEMENTATION_COMMIT=$IMPLEMENTATION_COMMIT"
          echo "CLASSIFICATION=BOUNDED_BACKPORT"
          echo "MG_DOSE_UNIT=PRESERVED"
          echo "HOSTED_VALIDATION=PASS"
          echo "REHEARSAL_MUTATED=NO"
          echo "PRODUCTION_MUTATED=NO"
