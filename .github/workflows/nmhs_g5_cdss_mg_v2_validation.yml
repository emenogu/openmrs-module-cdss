name: NMHS G5 CDSS mg v2 runtime-compatible validation

on:
  workflow_dispatch:
  push:
    branches:
      - g5-cdss-mg-dose-unit-v2-runtime-compatible-hosted-validation-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact control branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Prove runtime-compatible provenance and scope
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_COMMIT='9eae3cf49113b6d921e62b65de671cb101e52670'
          UPSTREAM_BASE='faaf04141150006a4ec82b8ee1d1996127c7f1e7'

          test "$(git rev-parse HEAD^)" = "$SOURCE_COMMIT"
          test "$(git rev-parse "${SOURCE_COMMIT}^")" = "$UPSTREAM_BASE"

          grep -F \
            '<version>2.0.0-SNAPSHOT</version>' \
            pom.xml

          actual="$(
            git diff-tree \
              --no-commit-id \
              --name-only \
              -r "$SOURCE_COMMIT" |
            sort
          )"

          expected="$(
            printf '%s\n' \
              'api/src/main/java/org/bahmni/module/fhircdss/api/util/DosageUnitMapper.java' \
              'api/src/test/java/org/bahmni/module/fhircdss/api/util/DosageUnitMapperTest.java' |
            sort
          )"

          test "$actual" = "$expected"

          grep -F \
            'MG_MG("mg", "mg"),' \
            api/src/main/java/org/bahmni/module/fhircdss/api/util/DosageUnitMapper.java

          grep -F \
            'assertEquals("mg", DosageUnitMapper.getTargetUnit("mg"));' \
            api/src/test/java/org/bahmni/module/fhircdss/api/util/DosageUnitMapperTest.java

          echo "NMHS_CDSS_MG_V2_PROVENANCE=PASS"

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run focused mg regression test
        run: >
          ./mvnw
          -B
          -ntp
          -pl api
          -Dtest=DosageUnitMapperTest
          test

      - name: Run full API module tests
        run: >
          ./mvnw
          -B
          -ntp
          -pl api
          test

      - name: Validation marker
        run: echo "NMHS_G5_CDSS_MG_V2_HOSTED_VALIDATION=PASS"
